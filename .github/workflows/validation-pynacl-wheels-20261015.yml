name: PyNaCl 3.15 validation wheels 20261015
permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/validation-constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/validation-constraints.txt
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/validation-constraints.txt
on:
  push:
    branches:
      - ci/validate-pynacl-315-20261015

jobs:
  sdist:
    runs-on: ubuntu-latest
    name: sdist
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -U pip build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: pynacl-sdist
          path: dist/pynacl*

  manylinux:
    runs-on: ${{ matrix.MANYLINUX.RUNNER }}
    container:
      image: ghcr.io/pyca/${{ matrix.MANYLINUX.CONTAINER }}
      volumes:
        - /staticnodehost:/staticnodecontainer:rw,rshared
        - /staticnodehost/24:/__e/node24:ro,rshared
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - { VERSION: "cp38-cp38m", PATH: "/opt/python/cp311-cp311/bin/python", ABI_VERSION: 'cp38' }
          - { VERSION: "cp314-cp314t", PATH: "/opt/python/cp314-cp314t/bin/python" }
          - { VERSION: "cp315-cp315t", PATH: "/opt/python/cp315-cp315t/bin/python" }
        MANYLINUX:
          - { NAME: "manylinux2014_x86_64", CONTAINER: "cryptography-manylinux2014:x86_64", RUNNER: "ubuntu-latest" }
          - { NAME: "manylinux_2_28_x86_64", CONTAINER: "cryptography-manylinux_2_28:x86_64", RUNNER: "ubuntu-latest" }
          - { NAME: "manylinux_2_34_x86_64", CONTAINER: "cryptography-manylinux_2_34:x86_64", RUNNER: "ubuntu-latest" }
          - { NAME: "musllinux_1_2_x86_64", CONTAINER: "cryptography-musllinux_1_2:x86_64", RUNNER: "ubuntu-latest" }

          - { NAME: "manylinux2014_aarch64", CONTAINER: "cryptography-manylinux2014_aarch64", RUNNER: "ubuntu-24.04-arm" }
          - { NAME: "manylinux_2_28_aarch64", CONTAINER: "cryptography-manylinux_2_28:aarch64", RUNNER: "ubuntu-24.04-arm" }
          - { NAME: "manylinux_2_34_aarch64", CONTAINER: "cryptography-manylinux_2_34:aarch64", RUNNER: "ubuntu-24.04-arm" }
          - { NAME: "musllinux_1_2_aarch64", CONTAINER: "cryptography-musllinux_1_2:aarch64", RUNNER: "ubuntu-24.04-arm" }


    name: "${{ matrix.PYTHON.VERSION }} for ${{ matrix.MANYLINUX.NAME }}"
    steps:
      - name: Ridiculous-er workaround for static node
        run: |
          cp -R /staticnode/* /staticnodecontainer/
      - name: Ridiculous alpine workaround for actions support on arm64
        run: |
          # This modifies /etc/os-release so the JS actions
          # from GH can't detect that it's on alpine:aarch64. It will
          # then use a glibc nodejs, which works fine when gcompat
          # is installed in the container (which it is)
          sed -i "s:ID=alpine:ID=NotpineForGHA:" /etc/os-release
        if: startsWith(matrix.MANYLINUX.NAME, 'musllinux') && endsWith(matrix.MANYLINUX.NAME, 'aarch64')

      - uses: actions/checkout@v7.0.1
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - run: ${{ matrix.PYTHON.PATH }} -m venv .venv
      - run: .venv/bin/pip install -U pip wheel cffi build
        if: ${{ !endsWith(matrix.PYTHON.VERSION, 't') }}
      - run: .venv/bin/pip install -U pip wheel 'cffi>=2.0.0' build
        if: endsWith(matrix.PYTHON.VERSION, 't')
      - name: Build the wheel
        run: |
          if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
              PY_LIMITED_API="--config-setting=--build-option=--py-limited-api=${{ matrix.PYTHON.ABI_VERSION }}"
          fi

          mkdir tmpwheelhouse
          LIBSODIUM_MAKE_ARGS="-j$(nproc)" .venv/bin/python -m build --wheel $PY_LIMITED_API
          mv dist/pynacl*.whl tmpwheelhouse/
      - run: auditwheel repair --plat ${{ matrix.MANYLINUX.NAME }} tmpwheelhouse/pynacl*.whl -w wheelhouse/
      - run: .venv/bin/pip install pynacl --no-index -f wheelhouse/
      - name: Test the installed wheel and interpreter mode
        run: |
          .venv/bin/python -c "
          import sys, sysconfig
          free_threaded = '${{ matrix.PYTHON.VERSION }}'.endswith('t')
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == free_threaded
          import nacl.signing
          assert not free_threaded or not sys._is_gil_enabled()
          key = nacl.signing.SigningKey.generate()
          signature = key.sign(b'test')
          key.verify_key.verify(signature)
          "

      - name: Run full installed-wheel suite outside checkout
        run: .venv/bin/python .github/validation-wheel-tests.py
      - run: mkdir pynacl-wheelhouse
      - run: mv wheelhouse/pynacl*.whl pynacl-wheelhouse/
      - uses: actions/upload-artifact@v7
        with:
          name: "pynacl-${{ github.event.inputs.version }}-${{ matrix.MANYLINUX.NAME }}-${{ matrix.PYTHON.VERSION }}"

          path: pynacl-wheelhouse/
  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - VERSION: '3.13'
            ABI_VERSION: 'cp38'
            DOWNLOAD_URL: 'https://www.python.org/ftp/python/3.13.7/python-3.13.7-macos11.pkg'
            BIN_PATH: '/Library/Frameworks/Python.framework/Versions/3.13/bin/python3'
          - VERSION: '3.14t'
            DOWNLOAD_URL: 'https://www.python.org/ftp/python/3.14.0/python-3.14.0-macos11.pkg'
            BIN_PATH: '/Library/Frameworks/PythonT.framework/Versions/3.14/bin/python3.14t'
          - VERSION: '3.15t'
            DOWNLOAD_URL: 'https://www.python.org/ftp/python/3.15.0/python-3.15.0-macos11.pkg'
            BIN_PATH: '/Library/Frameworks/PythonT.framework/Versions/3.15/bin/python3.15t'
    name: "Python ${{ matrix.PYTHON.VERSION }} ${{ matrix.PYTHON.ABI_VERSION }} on macOS"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - run: |
          curl "$PYTHON_DOWNLOAD_URL" -o python.pkg
          sudo installer -pkg python.pkg -target /
        env:
          PYTHON_DOWNLOAD_URL: ${{ matrix.PYTHON.DOWNLOAD_URL }}
        if: ${{ !endsWith(matrix.PYTHON.VERSION, 't') }}
      - run: |
          curl "$PYTHON_DOWNLOAD_URL" -o python.pkg
          sed "s/PythonTFramework-3.14/PythonTFramework-${PYTHON_VERSION%t}/" .github/config/macos-pkg-choices-freethreaded.xml > freethreaded-choices.xml
          sudo installer -pkg python.pkg -applyChoiceChangesXML freethreaded-choices.xml -target /
        env:
          PYTHON_DOWNLOAD_URL: ${{ matrix.PYTHON.DOWNLOAD_URL }}
          PYTHON_VERSION: ${{ matrix.PYTHON.VERSION }}
        if: endsWith(matrix.PYTHON.VERSION, 't')
      - run: ${{ matrix.PYTHON.BIN_PATH }} -m pip install -U virtualenv
      - run: ${{ matrix.PYTHON.BIN_PATH }} -m virtualenv venv
      - run: venv/bin/pip install -U pip wheel cffi build
        if: ${{ !endsWith(matrix.PYTHON.VERSION, 't') }}
      - run: venv/bin/pip install -U pip wheel 'cffi>=2.0.0' build
        if: endsWith(matrix.PYTHON.VERSION, 't')
      - name: Build the wheel
        run: |
            if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
              PY_LIMITED_API="--config-setting=--build-option=--py-limited-api=${{ matrix.PYTHON.ABI_VERSION }}"
            fi
            mkdir wheelhouse
            LIBSODIUM_MAKE_ARGS="-j$(sysctl -n hw.ncpu)" venv/bin/python -m build --wheel $PY_LIMITED_API
            mv dist/pynacl*.whl wheelhouse/
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.10'
          CFLAGS: '-arch arm64 -arch x86_64'
          ARCHFLAGS: '-arch arm64 -arch x86_64'
          _PYTHON_HOST_PLATFORM: 'macosx-10.9-universal2'
      - run: venv/bin/pip install -f wheelhouse --no-index pynacl
      - name: Test the installed wheel and interpreter mode
        run: |
          venv/bin/python -c "
          import sys, sysconfig
          free_threaded = '${{ matrix.PYTHON.VERSION }}'.endswith('t')
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == free_threaded
          import nacl.signing
          assert not free_threaded or not sys._is_gil_enabled()
          key = nacl.signing.SigningKey.generate()
          signature = key.sign(b'test')
          key.verify_key.verify(signature)
          "

      - name: Run full installed-wheel suite outside checkout
        run: venv/bin/python .github/validation-wheel-tests.py
      - run: mkdir pynacl-wheelhouse
      - run: mv wheelhouse/pynacl*.whl pynacl-wheelhouse/
      - uses: actions/upload-artifact@v7
        with:
          name: "pynacl-${{ github.event.inputs.version }}-macOS-${{ matrix.PYTHON.VERSION }}"
          path: pynacl-wheelhouse/
  windows:
    runs-on: ${{ matrix.WINDOWS.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - WINDOWS: {ARCH: 'x86', SODIUM_ARCH: 'Win32', VS_ARCH: 'x86', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.13', ABI_VERSION: 'cp38', SODIUM_MSVC_VERSION: 'v143'}
          - WINDOWS: {ARCH: 'x64', SODIUM_ARCH: 'x64', VS_ARCH: 'amd64', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.13', ABI_VERSION: 'cp38', SODIUM_MSVC_VERSION: 'v143'}
          - WINDOWS: {ARCH: 'x86', SODIUM_ARCH: 'Win32', VS_ARCH: 'x86', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.14t', SODIUM_MSVC_VERSION: 'v143'}
          - WINDOWS: {ARCH: 'x64', SODIUM_ARCH: 'x64', VS_ARCH: 'amd64', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.14t', SODIUM_MSVC_VERSION: 'v143'}
          - WINDOWS: {ARCH: 'x86', SODIUM_ARCH: 'Win32', VS_ARCH: 'x86', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.15t', SODIUM_MSVC_VERSION: 'v143'}
          - WINDOWS: {ARCH: 'x64', SODIUM_ARCH: 'x64', VS_ARCH: 'amd64', IMAGE: 'windows-latest'}
            PYTHON: {VERSION: '3.15t', SODIUM_MSVC_VERSION: 'v143'}
    name: "${{ matrix.PYTHON.VERSION }} ${{ matrix.WINDOWS.ARCH }} ${{ matrix.PYTHON.ABI_VERSION }}"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
          architecture: ${{ matrix.WINDOWS.ARCH }}
      - name: Extract libsodium libraries
        run: |
          Expand-Archive src/libsodium-1.0.20-stable-msvc.zip -DestinationPath c:\
        shell: powershell
      - name: Add sodium to paths
        run: |
          echo "INCLUDE=C:/libsodium/include;$INCLUDE" >> $GITHUB_ENV
          echo "LIB=C:/libsodium/${{ matrix.WINDOWS.SODIUM_ARCH }}/release/${{ matrix.PYTHON.SODIUM_MSVC_VERSION }}/static;$LIB" >> $GITHUB_ENV
        shell: bash

      - run: python -m pip install -U pip wheel cffi build
        if: ${{ !endsWith(matrix.PYTHON.VERSION, 't') }}
      - run: python -m pip install -U pip wheel 'cffi>=2.0.0' build
        if: endsWith(matrix.PYTHON.VERSION, 't')
      - name: Determine PY_LIMITED_API
        run: |
          if [ -n "${{ matrix.PYTHON.ABI_VERSION }}" ]; then
              PY_LIMITED_API="--config-setting=--build-option=--py-limited-api=${{ matrix.PYTHON.ABI_VERSION }}"
          fi
          echo "PY_LIMITED_API=$PY_LIMITED_API" >> $GITHUB_ENV
        shell: bash
      - name: Build the wheel
        run: |
          mkdir wheelhouse
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ matrix.WINDOWS.VS_ARCH }}
          python -m build --wheel %PY_LIMITED_API%
          mv dist/pynacl*.whl wheelhouse/
        shell: cmd
        env:
          PYNACL_SODIUM_LIBRARY_NAME: sodium
          PYNACL_SODIUM_STATIC: 1
          SODIUM_INSTALL: system
      - name: Test installing the wheel
        run: pip install -f wheelhouse pynacl --no-index
      - name: Test the installed wheel
        run: |
          python -c "
          import sys, sysconfig
          free_threaded = '${{ matrix.PYTHON.VERSION }}'.endswith('t')
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == free_threaded
          import nacl.signing
          assert not free_threaded or not sys._is_gil_enabled()
          key = nacl.signing.SigningKey.generate()
          signature = key.sign(b'test')
          key.verify_key.verify(signature)
          "
      - name: Run full installed-wheel suite outside checkout
        run: python .github/validation-wheel-tests.py
      - run: mkdir pynacl-wheelhouse
      - run: move wheelhouse\pynacl*.whl pynacl-wheelhouse\
      - uses: actions/upload-artifact@v7
        with:
          name: "pynacl-${{ github.event.inputs.version }}-win-${{ matrix.WINDOWS.ARCH }}-${{ matrix.PYTHON.VERSION }}"
          path: pynacl-wheelhouse\

  oldest-python-wheel:
    name: Python 3.8 installed ordinary wheel ${{ matrix.name }}
    needs: [manylinux, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            arch: x64
            artifact: pynacl-*-manylinux2014_x86_64-cp38-cp38m
          - name: macOS x64
            runner: macos-15-intel
            arch: x64
            artifact: pynacl-*-macOS-3.13
          - name: Windows x64
            runner: windows-latest
            arch: x64
            artifact: pynacl-*-win-x64-3.13
          - name: Windows x86
            runner: windows-latest
            arch: x86
            artifact: pynacl-*-win-x86-3.13
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ matrix.artifact }}
          path: wheelhouse
          merge-multiple: true
      - name: Exercise exact built wheel in a clean Python 3.8 environment
        run: python .github/validation-floor-tests.py
